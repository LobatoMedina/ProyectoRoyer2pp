services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb_bolsa_trabajo_dev
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_local_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-bolsa_trabajo}
      MARIADB_USER: ${MARIADB_USER:-bolsa_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-bolsa_local_password}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb_dev_data:
    driver: local
